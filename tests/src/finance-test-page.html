<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perplexity Finance Mock Page (new DOM)</title>
    <style>body { font-family: sans-serif; margin: 0; padding: 20px; }</style>
</head>
<body>
    <!--
      Mock DOM replicating the post-2026 Perplexity Finance Market Summary.
      Favicons are rendered as Google's favicon proxy with empty alt; the parser
      reads the domain from the `?domain=<host>` query parameter on the src.
    -->

    <!-- ========== MARKET SUMMARY SECTION ========== -->
    <div class="border-subtlest ring-subtlest divide-subtlest">
        <div class="px-sm md:px-md min-h-8 pb-xs flex flex-wrap items-center justify-between gap-sm">
            <h2 class="my-0 font-sans text-sm font-medium text-foreground">Market Summary</h2>
            <div class="flex items-center">
                <div class="font-sans text-xs font-medium text-quieter">Updated 1 minute ago</div>
            </div>
        </div>
        <div class="relative border rounded-xl mt-0 border-subtlest ring-subtlest divide-subtlest bg-raised">
            <div class="rounded-inherit border-subtlest ring-subtlest divide-subtlest">
                <div class="flex flex-col">
                    <button aria-expanded="true">
                        <div class="px-md py-sm">
                            <div class="pr-md">Crude Oil Surges Past $100 as U.S.-Iran Talks Stall</div>
                        </div>
                    </button>
                    <button aria-expanded="false">
                        <div class="px-md py-sm">
                            <div class="pr-md">AI Stocks Drag Nasdaq Lower on OpenAI Growth Concerns</div>
                        </div>
                    </button>
                </div>

                <!-- Sources button with favicons (Google favicon proxy URLs, empty alt) -->
                <div class="pt-sm p-md">
                    <button type="button" class="inline-flex rounded-full">
                        <span>
                            <div class="flex">
                                <div class="ml-xs flex">
                                    <div class="inline-flex rounded-full" style="width: 14px; height: 14px;">
                                        <div class="rounded-full" style="width: 14px; height: 14px;">
                                            <img class="relative block" alt="" width="14" height="14" src="https://www.google.com/s2/favicons?sz=128&amp;domain=finance.yahoo.com">
                                        </div>
                                    </div>
                                    <div class="inline-flex rounded-full" style="width: 14px; height: 14px;">
                                        <div class="rounded-full" style="width: 14px; height: 14px;">
                                            <img class="relative block" alt="" width="14" height="14" src="https://www.google.com/s2/favicons?sz=128&amp;domain=financemagnates.com">
                                        </div>
                                    </div>
                                    <div class="inline-flex rounded-full" style="width: 14px; height: 14px;">
                                        <div class="rounded-full" style="width: 14px; height: 14px;">
                                            <img class="relative block" alt="" width="14" height="14" src="https://www.google.com/s2/favicons?sz=128&amp;domain=investing.com">
                                        </div>
                                    </div>
                                </div>
                            </div>48 sources
                        </span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ========== RECENT DEVELOPMENTS SECTION (should NOT be parsed) ========== -->
    <div class="border-subtlest ring-subtlest divide-subtlest" style="margin-top: 20px;">
        <div class="px-sm md:px-md min-h-8 pb-xs flex flex-wrap items-center justify-between gap-sm">
            <h2 class="my-0 font-sans text-sm font-medium text-foreground">Recent Developments</h2>
        </div>
        <div class="relative border rounded-xl mt-0">
            <div>
                <div class="pt-sm p-md">
                    <button type="button" class="inline-flex rounded-full">
                        <span>
                            <div class="flex">
                                <div class="flex">
                                    <div class="inline-flex rounded-full" style="width: 14px; height: 14px;">
                                        <div class="rounded-full" style="width: 14px; height: 14px;">
                                            <img class="relative block" alt="" width="14" height="14" src="https://www.google.com/s2/favicons?sz=128&amp;domain=sharecafe.com.au">
                                        </div>
                                    </div>
                                    <div class="inline-flex rounded-full" style="width: 14px; height: 14px;">
                                        <div class="rounded-full" style="width: 14px; height: 14px;">
                                            <img class="relative block" alt="" width="14" height="14" src="https://www.google.com/s2/favicons?sz=128&amp;domain=atb.com">
                                        </div>
                                    </div>
                                </div>
                            </div>5 sources
                        </span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Chrome mock + test utilities -->
    <script type="module">
        window.__sentMessages = [];
        window.chrome = window.chrome || {
            runtime: {
                getManifest: () => ({ name: 'Test' }),
                sendMessage: (msg) => { window.__sentMessages.push(msg); },
                onMessage: { addListener: () => {} }
            },
            storage: {
                local: { _data: {}, get: async () => ({}), set: async () => {}, remove: async () => {}, clear: async () => {} },
                onChanged: { _listeners: [], addListener: () => {} }
            }
        };
        window.testUtilitiesReady = true;
    </script>

    <script type="module" src="build/finance-shim.bundle.js"></script>
</body>
</html>
